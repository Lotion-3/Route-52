name: Deploy to Firebase & Cloud Run (Main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npx expo export -p web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        working-directory: ./backend
        run: |
          IMAGE_TAG=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/basketbuddy/backend:latest
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy basketbuddy-backend \
            --image us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/basketbuddy/backend:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          # We'll use the service account key directly for the CLI
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY }}
        run: |
          # Write the secret to a temporary file for the CLI to use
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=sa.json
          firebase deploy --only hosting --non-interactive --project route52-c97a7
