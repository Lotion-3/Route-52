name: Deploy to Firebase & Cloud Run (Main)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Export Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run lint || echo "Lint failed but continuing for diagnostics"
          npx expo export -p web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        working-directory: ./backend
        run: |
          IMAGE_TAG=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/basketbuddy/backend:latest
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy basketbuddy-backend \
            --image us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/basketbuddy/backend:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUTE52_C97A7 }}'
          channelId: live
          projectId: route52-c97a7
