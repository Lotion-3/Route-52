name: Mint WAF sessions

# Mints every browser-dependent chain's session (Walmart, Target, ALDI,
# Instacart) on a 7GB runner (where a real browser fits) and publishes it to
# Supabase, so the 512MB web server never launches a browser or touches a
# retailer's CDN itself — see backend/mint_sessions.py. This is intentionally
# where ALL the memory/bandwidth-heavy work lives; Render should only ever be
# doing curl_cffi replays against what's published here.
#
# mint_sessions.py skips a chain whose published session is still fresh
# (younger than half its TTL), so most runs are cheap: ALDI (30-day TTL) mints
# once and is then skipped on ~1440 consecutive runs; Instacart (2h TTL) skips
# roughly every other run at this cadence. Walmart/Target (60min TTL) mint
# most runs, plus a quick asset-cache refresh each time.
#
# BUDGET NOTE: GitHub Actions gives PRIVATE repos ~2000 free minutes/month.
# At ~2-4 min/run, every-30-min (this default) ~= 48 runs/day ~= up to 5700
# min/mo worst case (all 4 chains minting), though the freshness-skip above
# keeps the realistic average well under that. Realistic free-tier options:
#   - raise the interval to hourly (~2800 min/mo worst case) if you're still
#     over budget;
#   - make the repo PUBLIC (unlimited Actions) — only after scrubbing secrets
#     from git history (config.env is in history);
#   - keep 30-min and accept the paid Actions overage (cheap) once launching.
# Tune the cron below to your budget.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

concurrency:
  group: mint-sessions
  cancel-in-progress: true       # never stack runs

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache CloakBrowser binary
        uses: actions/cache@v4
        with:
          # CloakBrowser caches its Chromium here; if the path differs it just
          # re-downloads (slower run), no correctness impact.
          path: ~/.cache/cloakbrowser
          key: cloakbrowser-${{ runner.os }}-v1

      - name: Install browser + system deps
        run: |
          python -m playwright install-deps chromium
          python -m cloakbrowser install

      - name: Mint + publish sessions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOAK_PROXY: ${{ secrets.CLOAK_PROXY }}
          MINT_CHAINS: ${{ vars.MINT_CHAINS }}   # optional: e.g. "walmart,target"
        run: python mint_sessions.py
